# /etc/rpimon.conf — configuración del agente rpimon
# Todas las claves pueden pasarse también como --clave valor en la línea de comandos.

# Servidor rpi-monitor (host/IP y puerto TCP de agentes)
server = 10.0.0.1
port = 7070

# Token compartido con el servidor (agents.token en config.json del servidor)
token = cambiar-este-token

# Identificador de la banca. Si se omite se arma con el número leído de id_file:
#   idBanca = "49"  en /var/local/settings.ini  ->  id = banca-49
# (coincide con las estaciones autogeneradas del servidor: prefijo "banca-", 2 dígitos).
# Si tampoco se puede leer el archivo, se usa el hostname.
#id = banca-07
id_file = /var/local/settings.ini
id_key = idBanca
id_prefix = banca-
id_pad = 2

# Segundos entre reportes
interval = 5

# Host contra el que se mide la latencia (default: el servidor).
# Se intenta ICMP; si no hay permisos, se mide el tiempo de conexión TCP a ping_port.
#ping_target = 10.0.0.1
#ping_port = 7070
ping_timeout_ms = 1000

# Comando de reinicio. Si se omite se prueban /sbin/reboot, reboot, systemctl reboot
# y como último recurso la syscall reboot().
#reboot_cmd = /sbin/reboot

# Poner en 1 para probar sin reiniciar de verdad.
#no_reboot = 0

# Poner en 1 si /dev/vcio da problemas (se usará vcgencmd o sysfs).
#no_mailbox = 0
